<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: aliceblue;
        }
        header{
            text-align: center;

        }
        section{
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input[type="text"], select, textarea,  input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
            padding: 0px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"]{
            width: 100%;
        }
        h1{
            color: #fff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: rgb(67, 67, 67);
        }
        p{
            color: #1d1d1d;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
</head>
<body>
    <header>
        <h1>RATE A MOVIE</h1>
        <br>
        <p>A feedback for a movie you love or want to review. Fill the texts below and make sure to be honest with your reviews and or feedbacks!</p>
    </header>
    <br>

    <section>
        <form action="">
            <img src="https://d1nhio0ox7pgb.cloudfront.net/_img/v_collection_png/512x512/shadow/movie.png" alt="movie icon.png">
            <br>

            <label for = movie> <b>Movie Title</b></label></label>
            <br>

            <input type="text" id="movie" name="movie" placeholder="Enter here">

            <br>
            <br>
            <label for=""><b>Genre/s</b></label>
            <br>
            <input type="checkbox" id="genre1" name="genre">
            <label for="genre1">Comedy</label>
            <input type="checkbox" id="genre2" name="genre">
            <label for="genre1">Action</label>
            <input type="checkbox" id="genre3" name="genre">
            <label for="genre1">Fantasy</label>
            <input type="checkbox" id="genre4" name="genre">
            <label for="genre1">Sci-Fi</label>
            <input type="checkbox" id="genre5" name="genre">
            <label for="genre1">Romance</label>

            <br>

            <textarea id="review" placeholder="Write a review here..." rows="4" cols="40"></textarea>
            <br>
            <br>
            <input type="submit" id="submit" value="Submit Review">
            <br>

            Click <a href="https://www.wikihow.com/Write-a-Review" target="_blank">here</a> for tips and or guides in making a review.
        </form>

    </section>

</body>
</html>
